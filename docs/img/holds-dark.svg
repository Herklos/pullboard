<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" width="960" height="374" role="img" aria-labelledby="title desc">
<title id="title">Judgement accumulates</title><desc id="desc">You approve decisions once, as spec rows, doctrine and answers. The board keeps them as the project's record, with a frozen bar for each item, every verdict and its reason, and the exact commit each verdict checked. A builder agent and a second agent both receive the item's frozen bar, and either can query the whole record at any time: the approved rows, every frozen bar, earlier proofs and every verdict with its reason; the builder hands over its exact commit, and the second agent checks it against the bar and writes the verdict and reason back to the record. Only your calls come back to you. Every item adds to the record, and every new session starts from all of it.</desc>
<style>

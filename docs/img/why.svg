<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 368" width="840" height="368" role="img" aria-labelledby="title desc">
<title id="title">Where vibe coding breaks, and what holds instead</title><desc id="desc">Where vibe coding breaks, and what holds instead. Pullboard enforces each fix, so none of it depends on you watching. Vibe coding: It said done. It wasn’t.; It forgot what you decided; Two agents, one file; You review every line. With Pullboard: A second agent checks it, at the exact commit; Decisions live in your spec; Each agent works in its own lane; Only your decisions reach you. On Pullboard's own board, 4 to 16 October 2026: 1 in 4 times an agent said done, a second agent sent it back (227 of 908), and 588 merged, 0 of them without an accept.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.card { fill: #ffffff; stroke: #d1d9e0; }
.head { font-size: 14px; font-weight: 600; }
.aside { font-size: 12px; fill: #59636e; }
.t1 { font-size: 14px; font-weight: 600; }
.t2 { font-size: 12px; fill: #59636e; }
.label { font-size: 12px; fill: #59636e; }
.code { font-size: 11.5px; fill: #59636e; }
.edge { fill: none; stroke: #8c959f; stroke-width: 1.5; }
.edge.back { stroke: #bc4c00; stroke-dasharray: 5 4; }
.edge.leader { stroke-width: 1; stroke-dasharray: 2 3; }
.tip { fill: #8c959f; }
.tip.back { fill: #bc4c00; }
.label.back { fill: #bc4c00; }
.frame { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
.plain rect { fill: #f6f8fa; stroke: #d1d9e0; }
.person rect { fill: #ddf4ff; stroke: #54aeff; }
.person .t1 { fill: #0a3069; } .person .t2 { fill: #0550ae; }
.agent rect { fill: #fbefff; stroke: #c297ff; }
.agent .t1 { fill: #3e1f79; } .agent .t2 { fill: #6639ba; }
.check rect { fill: #fff8c5; stroke: #d4a72c; }
.check .t1 { fill: #4d2d00; } .check .t2 { fill: #7d4e00; }
.done rect { fill: #dafbe1; stroke: #4ac26b; }
.done .t1 { fill: #044f1e; } .done .t2 { fill: #116329; }

</style>

<text class="title" x="24" y="34">Where vibe coding breaks, and what holds instead</text>
<text class="sub" x="24" y="54">Pullboard enforces each fix, so none of it depends on you watching.</text>
<rect class="zone" x="24" y="72" width="390" height="198" rx="10"/>
<text class="zl" x="38" y="94">VIBE CODING</text>
<rect class="zone" x="426" y="72" width="390" height="198" rx="10"/>
<text class="zl" x="440" y="94">WITH PULLBOARD</text>
<rect class="plain" x="40" y="110" width="358" height="30" rx="8"/><path class="ln" d="M52 121l8 8M60 121l-8 8"/><text class="m" x="72" y="130">It said done. It wasn’t.</text>
<rect class="ver" x="442" y="110" width="358" height="30" rx="8"/><path class="ln okl" d="M454 124l3 3 6-7"/><text class="h sm" x="474" y="130">A second agent checks it, at the exact commit</text>
<rect class="plain" x="40" y="148" width="358" height="30" rx="8"/><path class="ln" d="M52 159l8 8M60 159l-8 8"/><text class="m" x="72" y="168">It forgot what you decided</text>
<rect class="ver" x="442" y="148" width="358" height="30" rx="8"/><path class="ln okl" d="M454 162l3 3 6-7"/><text class="h sm" x="474" y="168">Decisions live in your spec</text>
<rect class="plain" x="40" y="186" width="358" height="30" rx="8"/><path class="ln" d="M52 197l8 8M60 197l-8 8"/><text class="m" x="72" y="206">Two agents, one file</text>
<rect class="ver" x="442" y="186" width="358" height="30" rx="8"/><path class="ln okl" d="M454 200l3 3 6-7"/><text class="h sm" x="474" y="206">Each agent works in its own lane</text>
<rect class="plain" x="40" y="224" width="358" height="30" rx="8"/><path class="ln" d="M52 235l8 8M60 235l-8 8"/><text class="m" x="72" y="244">You review every line</text>
<rect class="ver" x="442" y="224" width="358" height="30" rx="8"/><path class="ln okl" d="M454 238l3 3 6-7"/><text class="h sm" x="474" y="244">Only your decisions reach you</text>
<rect class="lay" x="24" y="282" width="792" height="62" rx="10"/>
<text class="nb" x="44" y="323">1 in 4</text>
<text class="h" x="150" y="309">times an agent said “done”, a second agent sent it back.</text>
<text class="m" x="150" y="327">908 submitted · 227 sent back · 588 merged · 0 merged without an accept · Pullboard’s own board, 4–16 Oct</text>

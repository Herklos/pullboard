<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" width="1020" height="430" role="img" aria-labelledby="title desc">
<title id="title">Judgement accumulates</title><desc id="desc">You approve rows, doctrine and answers once. The board keeps approved rows, a frozen bar for each item, proofs with exact commits and every verdict with its reason. The builder and second agent each receive the item’s frozen bar, and either can query the whole board at any time. The builder hands over its exact commit; the second agent checks it and returns a verdict and reason. Only your calls come back to you. Each item adds to the record, and each session starts from it.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.card { fill: #ffffff; stroke: #d1d9e0; }
.head { font-size: 14px; font-weight: 600; }
.aside { font-size: 12px; fill: #59636e; }
.t1 { font-size: 14px; font-weight: 600; }
.t2 { font-size: 12px; fill: #59636e; }
.label { font-size: 12px; fill: #59636e; }
.code { font-size: 11.5px; fill: #59636e; }
.edge { fill: none; stroke: #8c959f; stroke-width: 1.5; }
.edge.back { stroke: #bc4c00; stroke-dasharray: 5 4; }
.edge.leader { stroke-width: 1; stroke-dasharray: 2 3; }
.tip { fill: #8c959f; }
.tip.back { fill: #bc4c00; }
.label.back { fill: #bc4c00; }
.frame { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
.plain rect { fill: #f6f8fa; stroke: #d1d9e0; }
.person rect { fill: #ddf4ff; stroke: #54aeff; }
.person .t1 { fill: #0a3069; } .person .t2 { fill: #0550ae; }
.agent rect { fill: #fbefff; stroke: #c297ff; }
.agent .t1 { fill: #3e1f79; } .agent .t2 { fill: #6639ba; }
.check rect { fill: #fff8c5; stroke: #d4a72c; }
.check .t1 { fill: #4d2d00; } .check .t2 { fill: #7d4e00; }
.done rect { fill: #dafbe1; stroke: #4ac26b; }
.done .t1 { fill: #044f1e; } .done .t2 { fill: #116329; }
@media (prefers-color-scheme: dark) {
  text { fill: #f0f6fc; }
  .card { fill: #0d1117; stroke: #3d444d; }
  .aside, .t2, .label, .code { fill: #9198a1; }
  .edge { stroke: #6e7681; }
  .edge.back { stroke: #f0883e; }
  .tip { fill: #6e7681; }
  .tip.back, .label.back { fill: #f0883e; }
  .frame { stroke: #3d444d; }
  .plain rect { fill: #151b23; stroke: #3d444d; }
  .person rect { fill: #0c2d6b; stroke: #1f6feb; }
  .person .t1 { fill: #cae8ff; } .person .t2 { fill: #a5d6ff; }
  .agent rect { fill: #271052; stroke: #8957e5; }
  .agent .t1 { fill: #ecdeff; } .agent .t2 { fill: #d2a8ff; }
  .check rect { fill: #272115; stroke: #9e6a03; }
  .check .t1 { fill: #f8e3a1; } .check .t2 { fill: #e3b341; }
  .done rect { fill: #04260f; stroke: #238636; }
  .done .t1 { fill: #aff5b4; } .done .t2 { fill: #7ee787; }
}
</style>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="tip" d="M0 1 L9 5 L0 9 z"/></marker>
<marker id="tip-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="tip back" d="M0 1 L9 5 L0 9 z"/></marker>
</defs>
<rect class="card" x="0.5" y="0.5" width="1019" height="429" rx="12"/>
<text class="head" x="24" y="34">Judgement accumulates</text>
<text class="aside" x="24" y="55">Every piece of work starts from everything decided and proved before it.</text>
<rect class="frame" x="24" y="76" width="220" height="310" rx="10"/>
<rect class="frame" x="288" y="76" width="430" height="310" rx="10"/>
<rect class="frame" x="770" y="76" width="226" height="310" rx="10"/>
<text class="t1" x="40" y="101">You</text>
<text class="t1" x="304" y="101">The board · the project's record</text>
<text class="t1" x="786" y="101">Agents · one lane each</text>
<g class="person"><rect x="40" y="124" width="188" height="66" rx="8"/><text class="t1" x="134" y="153" text-anchor="middle">Your decisions</text><text class="t2" x="134" y="171" text-anchor="middle">rows · doctrine · answers</text></g>
<g class="plain"><rect x="40" y="264" width="188" height="66" rx="8"/><text class="t1" x="134" y="293" text-anchor="middle">Only your calls</text><text class="t2" x="134" y="311" text-anchor="middle">questions passed up</text></g>
<g class="person"><rect x="306" y="116" width="394" height="42" rx="8"/><text class="t1" x="320" y="142">Approved rows</text><text class="t2" x="686" y="142" text-anchor="end">what must be true</text></g>
<g class="person"><rect x="306" y="164" width="394" height="42" rx="8" stroke-dasharray="4 3"/><text class="t1" x="320" y="190">Frozen bars</text><text class="t2" x="686" y="190" text-anchor="end">one per item, from the rows</text></g>
<g class="check"><rect x="306" y="212" width="394" height="42" rx="8"/><text class="t1" x="320" y="238">Proofs</text><text class="t2" x="686" y="238" text-anchor="end">the exact commit each verdict checked</text></g>
<g class="agent"><rect x="306" y="260" width="394" height="42" rx="8"/><text class="t1" x="320" y="286">Verdicts</text><text class="t2" x="686" y="286" text-anchor="end">every accept and reject, with the reason</text></g>
<g class="done"><rect x="306" y="316" width="394" height="8" rx="4"/></g>
<text class="label" x="503" y="346" text-anchor="middle">each item adds to the record · each session starts from it</text>
<text class="aside" x="700" y="375" text-anchor="end">each layer takes the colour of who wrote it</text>
<g class="check"><rect x="786" y="132" width="194" height="66" rx="8"/><text class="t1" x="883" y="161" text-anchor="middle">Builder</text><text class="t2" x="883" y="179" text-anchor="middle">builds to the bar</text></g>
<g class="agent"><rect x="786" y="264" width="194" height="66" rx="8"/><text class="t1" x="883" y="293" text-anchor="middle">Second agent</text><text class="t2" x="883" y="311" text-anchor="middle">checks it against the bar</text></g>
<path class="edge" d="M 228 157 L 300 137" marker-end="url(#tip)"/>
<rect class="card" x="228" y="137" width="70" height="22" rx="11"/>
<text class="label" x="263" y="152" text-anchor="middle">approve once</text>
<path class="edge" d="M 700 185 L 748 185 L 748 165 L 780 165" marker-end="url(#tip)"/>
<path class="edge" d="M 748 185 L 748 297 L 780 297" marker-end="url(#tip)"/>
<circle class="tip" cx="748" cy="185" r="3"/>
<rect class="card" x="704" y="169" width="70" height="22" rx="11"/>
<text class="label" x="739" y="184" text-anchor="middle">frozen bar</text>
<path class="edge" d="M 882 198 L 882 258" marker-end="url(#tip)"/>
<rect class="card" x="837" y="217" width="90" height="22" rx="11"/>
<text class="label" x="882" y="232" text-anchor="middle">exact commit</text>
<path class="edge" d="M 786 297 L 706 281" marker-end="url(#tip)"/>
<rect class="card" x="700" y="267" width="120" height="22" rx="11"/>
<text class="label" x="760" y="282" text-anchor="middle">verdict + reason</text>
<path class="edge leader" d="M 306 281 L 234 297" marker-end="url(#tip)"/>
<rect class="card" x="226" y="287" width="78" height="22" rx="11"/>
<text class="label" x="265" y="302" text-anchor="middle">only your calls</text>
<path class="edge leader" d="M 786 143 L 754 143 L 754 86 L 505 86 L 505 80" marker-end="url(#tip)"/>
<path class="edge leader" d="M 786 275 L 746 275 L 746 86 L 505 86 L 505 80" marker-end="url(#tip)"/>
<rect class="card" x="638" y="76" width="112" height="22" rx="11"/>
<text class="label" x="694" y="91" text-anchor="middle">query any time</text>
</svg>

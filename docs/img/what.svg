<rect class="bld" x="297.33333333333337" y="188" width="245.33333333333334" height="78" rx="8"/><g class="ico" transform="translate(309.33333333333337 201.45) scale(0.75)"><path d="M9 3v5M15 3v5M6.5 8h11v3.5a5.5 5.5 0 0 1-11 0Z"/><path d="M12 17v4"/></g><text class="h" x="337.33333333333337" y="215">Plug in any agent</text><text class="m" x="337.33333333333337" y="234">Keep Claude Code or Codex,</text><text class="m" x="337.33333333333337" y="249">and add any MCP client.</text>
<rect class="lay" x="554.6666666666667" y="188" width="245.33333333333334" height="78" rx="8"/><g class="ico" transform="translate(566.6666666666667 201.82) scale(0.75)"><rect x="2.5" y="4" width="12" height="9" rx="1.5"/><path d="M6.5 16.5h4M8.5 13v3.5"/><rect x="15" y="8" width="6.5" height="11" rx="1.5"/><path d="M17.5 16.5h1.5"/></g><text class="h" x="594.6666666666667" y="215">Across your machines</text><text class="m" x="594.6666666666667" y="234">Pair a machine once. Its agents</text><text class="m" x="594.6666666666667" y="249">share your board, in one order.</text>

# The gate on every push to main and every pull request, with the oldest Node pullboard supports and
# the newest (C7). macOS runs once the repository is public: GitHub bills macOS minutes tenfold on
# private repositories, and runs public ones free. Full history, since spec check reads it. Run it by
# hand on any branch to prove an exact commit: gh workflow run gate.yml --ref <branch>.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only pushes to main share a group, so newer main commits cancel older in-progress runs.
# PRs and manual runs get a unique group and cannot cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.node }}) ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
        shard: [1, 2, 3]
        shards: [3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node bin/pullboard.js spec check
      - run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

  macos:
    name: macos (${{ matrix.node }}) ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
        shard: [1, 2]
        shards: [2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node bin/pullboard.js spec check
      - run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

  hosted-shapes:
    name: hosted shapes (every way to open a board through pullboard.dev)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Hang ceiling for six board states in each available browser; WebKit runs only where a Playwright build exists.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the matrix outside the gate
        run: npm run hosted-shapes

  perf:
    name: view performance (3000 items, eight projects)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Hang ceiling for browser setup and five samples; the view budgets remain 100/250 ms.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Measure the view outside the gate
        shell: bash
        run: |
          mkdir -p artifacts/performance
          export PULLBOARD_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$PULLBOARD_CHROME" ]]; then
            echo "::error::Chrome is required for the view performance measurement"
            exit 1
          fi
          node test/cockpit/perf/run.mjs --seed main-ci-n40 --size 3000 --projects 8 --runs 5 --idle 30 --live-every 5 > artifacts/performance/harness-output.txt
      - name: Report fixed budgets and idle observations
        if: always()
        run: node bin/check-perf-budgets.js artifacts/performance/harness-output.txt artifacts/performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: view-performance
          path: artifacts/performance/
          if-no-files-found: error
